<!doctype html>
<html lang="zh-CN" data-theme="pink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>预约拍摄设计原型</title>
    <link rel="icon" href="data:," />
    <link
      rel="stylesheet"
      href="../app/node_modules/@fortawesome/fontawesome-free/css/all.min.css"
    />
    <style>
      :root {
        color-scheme: light;
        --accent: #ff7fae;
        --accent-rgb: 255, 127, 174;
        --accent-strong: #ff5f98;
        --accent-soft: #ffd9e9;
        --accent-bg: #fff6fb;
        --background: #fff9fc;
        --surface: #ffffff;
        --ink: #3f3b4f;
        --muted: #756d86;
        --muted-soft: #8a8295;
        --line: #f1d6e7;
        --status: #a86512;
        --status-bg: #fff7e8;
        --status-line: #f2d8ac;
        --success: #2f836c;
        --success-bg: #effaf6;
        --success-line: #ccecdf;
        --danger: #ca4d61;
        --shadow: rgba(255, 127, 174, 0.12);
      }

      :root[data-theme="blue"] {
        --accent: #5da8ff;
        --accent-rgb: 93, 168, 255;
        --accent-strong: #3a8bf0;
        --accent-soft: #dcebff;
        --accent-bg: #f3f8ff;
        --background: #f6fbff;
        --muted: #65758a;
        --muted-soft: #8291a3;
        --line: #d8e7ff;
        --status: #347a9c;
        --status-bg: #edf8ff;
        --status-line: #cde9ff;
        --shadow: rgba(93, 168, 255, 0.12);
      }

      :root[data-theme="yellow"] {
        --accent: #d39b23;
        --accent-rgb: 211, 155, 35;
        --accent-strong: #b98010;
        --accent-soft: #f7e7bd;
        --accent-bg: #fff9e9;
        --background: #fffcf0;
        --muted: #756f62;
        --muted-soft: #8b8373;
        --line: #f2e0b8;
        --status: #9d6a00;
        --status-bg: #fff8e5;
        --status-line: #f1d59a;
        --shadow: rgba(211, 155, 35, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html {
        min-height: 100%;
        background: #eef2f7;
      }

      body {
        min-height: 100%;
        margin: 0;
        padding: 16px;
        background: #eef2f7;
        color: var(--ink);
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        letter-spacing: 0;
      }

      button,
      input,
      textarea,
      summary {
        font: inherit;
      }

      button,
      summary,
      input,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .prototype-toolbar {
        display: flex;
        width: min(760px, 100%);
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 auto 10px;
        color: #667085;
        font-size: 12px;
      }

      .prototype-toolbar strong {
        color: #344054;
        font-size: 13px;
      }

      .theme-switcher {
        display: inline-flex;
        gap: 5px;
        border: 1px solid #d8dee8;
        border-radius: 10px;
        padding: 4px;
        background: #ffffff;
      }

      .theme-switcher button {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #667085;
      }

      .theme-switcher button[aria-pressed="true"] {
        background: #f2f4f7;
        box-shadow: inset 0 0 0 1px #d0d5dd;
        color: #101828;
      }

      .theme-dot {
        display: block;
        width: 14px;
        height: 14px;
        margin: auto;
        border: 2px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px #c8ced8;
      }

      .theme-dot--pink {
        background: #ff7fae;
      }

      .theme-dot--blue {
        background: #5da8ff;
      }

      .theme-dot--yellow {
        background: #d39b23;
      }

      .app-shell {
        position: relative;
        width: min(760px, 100%);
        min-height: 844px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--line) 72%, #d5dae3);
        border-radius: 16px;
        background: var(--background);
        box-shadow: 0 18px 48px rgba(28, 39, 64, 0.12);
      }

      .booking-header {
        position: sticky;
        top: 0;
        z-index: 12;
        display: grid;
        min-height: 64px;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid
          color-mix(in srgb, var(--line) 72%, transparent);
        padding: 8px 18px;
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        backdrop-filter: blur(14px);
      }

      .booking-brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        display: inline-flex;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--accent-soft);
        border-radius: 11px;
        background: var(--accent-bg);
        color: var(--accent-strong);
        font-size: 17px;
      }

      .booking-brand h1,
      .booking-brand p {
        margin: 0;
      }

      .booking-brand h1 {
        color: var(--ink);
        font-size: 19px;
        font-weight: 800;
      }

      .booking-brand p {
        overflow: hidden;
        margin-top: 2px;
        color: var(--muted-soft);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .header-links {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .header-link {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        gap: 5px;
        border: 0;
        padding: 0 9px;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .header-link:last-child {
        color: var(--accent-strong);
      }

      .page-content {
        padding: 14px 14px 94px;
      }

      .booking-paper {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 10px 28px var(--shadow);
      }

      .form-section {
        position: relative;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 12px;
        padding: 18px;
      }

      .form-section + .form-section {
        border-top: 1px solid var(--line);
      }

      .step-rail {
        position: relative;
        display: flex;
        justify-content: center;
      }

      .step-rail::after {
        position: absolute;
        top: 34px;
        bottom: -19px;
        width: 1px;
        background: var(--line);
        content: "";
      }

      .form-section:last-child .step-rail::after {
        display: none;
      }

      .step-number {
        position: relative;
        z-index: 1;
        display: inline-flex;
        width: 30px;
        height: 30px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--accent-soft);
        border-radius: 9px;
        background: var(--accent-bg);
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 800;
      }

      .section-body {
        min-width: 0;
      }

      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 30px;
        margin-bottom: 13px;
      }

      .section-heading h2,
      .section-heading p {
        margin: 0;
      }

      .section-heading h2 {
        color: var(--ink);
        font-size: 14px;
        font-weight: 800;
      }

      .section-note {
        color: var(--muted-soft);
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .field {
        display: block;
        min-width: 0;
      }

      .field--wide {
        grid-column: 1 / -1;
      }

      .field-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .required {
        color: var(--danger);
      }

      .field-control,
      .field-button {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--ink);
        font-size: 13px;
      }

      .field-control {
        padding: 0 12px;
        outline: 0;
      }

      textarea.field-control {
        min-height: 78px;
        resize: vertical;
        padding-top: 11px;
        line-height: 1.6;
      }

      .field-control::placeholder {
        color: color-mix(in srgb, var(--muted-soft) 58%, transparent);
      }

      .field-control:focus,
      .field-button:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.14);
      }

      .field-button {
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr) 14px;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        text-align: left;
      }

      .field-button > i:first-child {
        color: var(--accent-strong);
      }

      .field-button span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .field-button > i:last-child {
        color: var(--muted-soft);
        font-size: 10px;
        text-align: right;
      }

      .inline-details {
        margin-top: 12px;
        border-top: 1px dashed var(--line);
        padding-top: 4px;
      }

      .inline-details summary,
      .preference-panel summary {
        display: grid;
        min-height: 44px;
        grid-template-columns: 24px minmax(0, 1fr) auto 12px;
        align-items: center;
        gap: 7px;
        list-style: none;
        color: var(--ink);
        cursor: pointer;
      }

      .inline-details summary::-webkit-details-marker,
      .preference-panel summary::-webkit-details-marker {
        display: none;
      }

      .inline-details summary > i:first-child,
      .preference-panel summary > i:first-child {
        color: var(--accent-strong);
      }

      .inline-details summary strong,
      .preference-panel summary strong {
        font-size: 12px;
        font-weight: 800;
      }

      .summary-meta {
        color: var(--muted-soft);
        font-size: 10px;
      }

      .summary-arrow {
        color: var(--muted-soft);
        font-size: 10px;
        transition: transform 180ms ease;
      }

      details[open] > summary .summary-arrow {
        transform: rotate(90deg);
      }

      .details-body {
        padding: 7px 0 4px 31px;
      }

      .preference-panel {
        border: 1px solid var(--accent-soft);
        border-radius: 11px;
        background: var(--accent-bg);
      }

      .preference-panel summary {
        padding: 0 12px;
      }

      .preference-panel .details-body {
        border-top: 1px solid
          color-mix(in srgb, var(--accent-soft) 76%, transparent);
        padding: 12px;
      }

      .theme-chips,
      .availability-chips,
      .role-switch {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .theme-chip,
      .time-chip,
      .role-option {
        display: inline-flex;
        min-height: 36px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 0 10px;
        background: var(--surface);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .theme-chip[aria-pressed="true"],
      .role-option[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .preference-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }

      .preference-grid .field-control {
        background: color-mix(in srgb, var(--surface) 94%, transparent);
      }

      .service-panel {
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 12px;
        background: color-mix(in srgb, var(--accent-bg) 38%, var(--surface));
      }

      .service-panel + .service-panel {
        margin-top: 10px;
      }

      .service-panel__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .service-index {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 9px;
      }

      .service-icon {
        display: inline-flex;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        background: var(--accent-bg);
        color: var(--accent-strong);
      }

      .service-index strong,
      .service-index span {
        display: block;
      }

      .service-index strong {
        font-size: 13px;
        font-weight: 800;
      }

      .service-index span {
        margin-top: 2px;
        color: var(--muted-soft);
        font-size: 10px;
      }

      .icon-button {
        display: inline-flex;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--muted);
      }

      .provider-row {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
      }

      .provider-avatar {
        display: block;
        width: 48px;
        height: 48px;
        border: 2px solid var(--surface);
        border-radius: 12px;
        background: var(--accent-bg);
        box-shadow: 0 0 0 1px var(--accent-soft);
        object-fit: cover;
      }

      .provider-copy {
        min-width: 0;
      }

      .provider-name-line {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 6px;
      }

      .provider-name-line strong {
        overflow: hidden;
        font-size: 13px;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .provider-status {
        flex: 0 0 auto;
        border: 1px solid var(--success-line);
        border-radius: 999px;
        padding: 2px 6px;
        background: var(--success-bg);
        color: var(--success);
        font-size: 9px;
        font-weight: 700;
      }

      .provider-copy p {
        overflow: hidden;
        margin: 3px 0 0;
        color: var(--muted-soft);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .text-button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border: 0;
        padding: 0 4px;
        background: transparent;
        color: var(--accent-strong);
        font-size: 11px;
        font-weight: 700;
      }

      .service-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .role-block,
      .availability-block {
        grid-column: 1 / -1;
      }

      .sub-label {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .availability-block {
        border-top: 1px dashed var(--line);
        padding-top: 11px;
      }

      .time-chip {
        min-height: 34px;
        border-color: var(--success-line);
        background: var(--success-bg);
        color: var(--success);
      }

      .time-chip[aria-pressed="true"] {
        border-color: var(--success);
        box-shadow: 0 0 0 2px
          color-mix(in srgb, var(--success) 18%, transparent);
      }

      .busy-note {
        margin: 8px 0 0;
        color: var(--status);
        font-size: 10px;
      }

      .service-extras {
        grid-column: 1 / -1;
        border-top: 1px dashed var(--line);
        padding-top: 4px;
      }

      .service-extras summary {
        min-height: 44px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }

      .upload-placeholder {
        display: inline-flex;
        width: 76px;
        height: 76px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border: 1px dashed var(--accent-soft);
        border-radius: 10px;
        background: var(--accent-bg);
        color: var(--accent-strong);
        font-size: 10px;
      }

      .add-service {
        display: inline-flex;
        width: 100%;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin-top: 10px;
        border: 1px dashed var(--accent-soft);
        border-radius: 10px;
        background: var(--accent-bg);
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 800;
      }

      .submit-dock {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 20;
        display: grid;
        width: min(760px, 100%);
        grid-template-columns: minmax(0, 1fr) minmax(180px, 280px);
        align-items: center;
        gap: 14px;
        margin: 0 auto;
        border-top: 1px solid var(--line);
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--surface) 95%, transparent);
        backdrop-filter: blur(14px);
      }

      .submit-summary strong,
      .submit-summary span {
        display: block;
      }

      .submit-summary strong {
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
      }

      .submit-summary span {
        margin-top: 2px;
        color: var(--muted-soft);
        font-size: 10px;
      }

      .primary-button {
        display: inline-flex;
        width: 100%;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 0;
        border-radius: 11px;
        background: var(--accent-strong);
        color: #ffffff;
        box-shadow: 0 9px 18px rgba(var(--accent-rgb), 0.24);
        font-size: 13px;
        font-weight: 800;
      }

      .sheet-backdrop {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 0;
        background: rgba(28, 35, 48, 0.3);
      }

      .sheet-backdrop[hidden] {
        display: none;
      }

      .provider-sheet {
        width: min(760px, 100%);
        max-height: 82vh;
        overflow: hidden;
        border-radius: 16px 16px 0 0;
        background: var(--surface);
        box-shadow: 0 -18px 44px rgba(28, 35, 48, 0.18);
      }

      .sheet-handle {
        width: 38px;
        height: 4px;
        margin: 9px auto 4px;
        border-radius: 999px;
        background: var(--line);
      }

      .sheet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 14px;
      }

      .sheet-header h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
      }

      .sheet-search {
        display: grid;
        min-height: 46px;
        grid-template-columns: 20px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        margin: 0 14px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 12px;
        background: var(--accent-bg);
        color: var(--muted-soft);
      }

      .sheet-search input {
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
      }

      .provider-list {
        display: grid;
        gap: 8px;
        max-height: calc(82vh - 126px);
        overflow-y: auto;
        padding: 0 14px calc(14px + env(safe-area-inset-bottom));
      }

      .provider-option {
        display: grid;
        width: 100%;
        min-height: 70px;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 10px;
        background: var(--surface);
        color: var(--ink);
        text-align: left;
      }

      .provider-option.is-selected {
        border-color: var(--accent);
        background: var(--accent-bg);
      }

      .provider-option img {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
      }

      .provider-option strong,
      .provider-option span {
        display: block;
      }

      .provider-option strong {
        font-size: 12px;
        font-weight: 800;
      }

      .provider-option span {
        overflow: hidden;
        margin-top: 3px;
        color: var(--muted-soft);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .availability-count {
        color: var(--success);
        font-size: 10px;
        font-weight: 700;
        white-space: nowrap;
      }

      .toast {
        position: fixed;
        top: 78px;
        left: 50%;
        z-index: 60;
        max-width: calc(100vw - 40px);
        transform: translateX(-50%) translateY(-8px);
        border-radius: 999px;
        padding: 8px 13px;
        background: color-mix(in srgb, var(--ink) 92%, transparent);
        color: #ffffff;
        font-size: 11px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 160ms ease,
          transform 160ms ease;

      const providerSheet = document.getElementById("provider-sheet");

      const toast = document.getElementById("toast");
      let activeServiceCard = document.querySelector("[data-service-card]");
      let toastTimer = 0;

      const showToast = (message) => {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("is-visible");
        toastTimer = window.setTimeout(
          () => toast.classList.remove("is-visible"),
          1800,
        );
      };

      const setTheme = (theme) => {
        root.dataset.theme = theme;
        themeButtons.forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.themeOption === theme),
          );
        });
      };

      themeButtons.forEach((button) => {
        button.addEventListener("click", () =>
          setTheme(button.dataset.themeOption),
        );
      });

      themeChips.forEach((button) => {
        button.addEventListener("click", () => {
          const wasSelected = button.getAttribute("aria-pressed") === "true";
          themeChips.forEach((item) =>
            item.setAttribute("aria-pressed", "false"),
          );
          button.setAttribute("aria-pressed", String(!wasSelected));
        });
      });

      const updateServiceCount = () => {
        const cards = [...serviceList.querySelectorAll("[data-service-card]")];
        cards.forEach((card, index) => {
          card.querySelector("[data-service-title]").textContent =
            `服务者 ${index + 1}`;
          card.querySelector(".remove-service").hidden = cards.length === 1;
        });
        const label = `${cards.length} 位服务者`;
        countNote.textContent = label;
        submitTitle.textContent = label;
      };

      const setSheetOpen = (open) => {
        providerSheet.hidden = !open;
        document.body.style.overflow = open ? "hidden" : "";
        if (open) {
          window.setTimeout(() => providerSearch.focus(), 50);
        }
      };

      document.addEventListener("click", (event) => {
        const target = event.target.closest("button");
        if (!target) return;

        if (target.classList.contains("choose-provider")) {
          activeServiceCard = target.closest("[data-service-card]");
          setSheetOpen(true);
          return;
        }

        if (target.classList.contains("remove-service")) {
          target.closest("[data-service-card]").remove();
          updateServiceCount();
          showToast("已移除该服务者");
          return;
        }

        if (target.classList.contains("role-option")) {
          target.parentElement
            .querySelectorAll(".role-option")
            .forEach((item) => {
              item.setAttribute("aria-pressed", String(item === target));
            });
          return;
        }

        if (target.classList.contains("time-chip")) {
          const card = target.closest("[data-service-card]");
          card.querySelectorAll(".time-chip").forEach((item) => {
            item.setAttribute("aria-pressed", String(item === target));
          });
          const [start, end] = target.dataset.range.split("|");
          card.querySelector("[data-start-time]").textContent = start;
          card.querySelector("[data-end-time]").textContent = end;
          showToast(`已选择 ${start}–${end}`);
          return;
        }

        if (target.dataset.toast) showToast(target.dataset.toast);
      });

      document.getElementById("add-service").addEventListener("click", () => {
        const fragment = serviceTemplate.content.cloneNode(true);
        serviceList.appendChild(fragment);
        updateServiceCount();
        serviceList.lastElementChild.scrollIntoView({
          behavior: "smooth",
          block: "center",
        });
      });

      document
        .getElementById("close-provider-sheet")
        .addEventListener("click", () => setSheetOpen(false));
      providerSheet.addEventListener("click", (event) => {
        if (event.target === providerSheet) setSheetOpen(false);
      });

      document.querySelectorAll(".provider-option").forEach((option) => {
        option.addEventListener("click", () => {
          if (activeServiceCard) {
            activeServiceCard.querySelector(
              "[data-provider-name]",
            ).textContent = option.dataset.provider;
          }
          document
            .querySelectorAll(".provider-option")
            .forEach((item) => item.classList.remove("is-selected"));
          option.classList.add("is-selected");
          setSheetOpen(false);
          showToast(`已选择 ${option.dataset.provider}`);
        });
      });

      providerSearch.addEventListener("input", () => {
        const keyword = providerSearch.value.trim().toLowerCase();
        document.querySelectorAll(".provider-option").forEach((option) => {
          option.hidden = !option.textContent.toLowerCase().includes(keyword);
        });
      });

      document
        .getElementById("booking-form")
        .addEventListener("submit", (event) => {
          event.preventDefault();
          showToast("原型演示：预约信息已准备提交");
        });

      updateServiceCount();
    </script>
  </body>
</html>
